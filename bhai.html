<!DOCTYPE html>
<html lang="ur">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>❤️</title>

<!-- Romantic Fonts -->
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Playfair+Display:wght@400;500&display=swap" rel="stylesheet">

<style>
* { box-sizing: border-box; }

body {
    margin: 0;
    height: 100vh;
    background: linear-gradient(180deg, #ffc0cb, #ffe6f0);
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: 'Playfair Display', serif;
    overflow: hidden;
}

.card {
    background: #fff0f5;
    width: 90%;
    max-width: 360px;
    padding: 32px 22px;
    border-radius: 26px;
    text-align: center;
    box-shadow: 0 18px 40px rgba(0,0,0,0.2);
}

h1 {
    font-family: 'Playfair Display', serif;
    font-size: 28px;
    color: #d63384;
    margin-bottom: 20px;
}

.music-btn {
    background: #ff85a1;
    color: white;
    border: none;
    padding: 8px 18px;
    border-radius: 20px;
    font-size: 14px;
    margin-bottom: 20px;
    cursor: pointer;
}

.buttons {
    position: relative;
    height: 120px;
}

button {
    padding: 12px 30px;
    font-size: 18px;
    font-family: 'Playfair Display', serif;
    border: none;
    border-radius: 30px;
    cursor: pointer;
}

#yes {
    background: #ff4d6d;
    color: white;
}

#no {
    background: #a0a0a0;
    color: white;
    position: absolute;
    left: 50%;
    transform: translateX(-50%);
    top: 60px;
}

/* Hearts */
.heart {
    position: fixed;
    font-size: 22px;
    animation: floatUp 4s linear forwards;
}

@keyframes floatUp {
    from { transform: translateY(0); opacity: 1; }
    to { transform: translateY(-100vh); opacity: 0; }
}
</style>
</head>
